name: Security CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  pull-requests: read
  statuses: read
  
jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with: 
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Git Leaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Confirmation
        run: echo 'Verification passed ✔️'