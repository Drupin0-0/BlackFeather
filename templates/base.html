<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <title>{% block title %}BlackFeather | Task Manager{% endblock %}</title>
    
    <!-- Mantido como pedido -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Tipografia Profissional Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    

    <!-- Script Oficial e Estável do Lottie Player -->
    <script src="https://unpkg.com"></script>
    
    <link rel="stylesheet" href="{% static 'css/base-auth.css' %}">
</head>
<body>

    {% block content %}
    {% endblock %}

</body>
</html>
