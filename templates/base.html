<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.png' %}">
    <title>{% block title %}BlackFeather | Task Manager{% endblock %}</title>
    
    <!-- Mantido como pedido -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Tipografia Profissional Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    

    <!-- Estilização Direta e Robusta -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* Container Principal do Card */
        .auth-card {
            width: 100%;
            max-width: 400px;
            background-color: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .auth-card h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .auth-card .subtitle {
            font-size: 13px;
            color: #737373;
            margin-bottom: 24px;
        }

        /* Inputs e Grupos de Formulário */
        .auth-card .form-group {
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .auth-card .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .auth-card label {
            font-size: 12px;
            font-weight: 500;
            color: #a3a3a3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auth-card input[type="text"],
        .auth-card input[type="email"],
        .auth-card input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #000000;
            border: 1px solid #262626;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .auth-card input:focus {
            border-color: #ffffff;
        }

        /* Links */
        .auth-card a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            transition: opacity 0.2s ease;
        }

        .auth-card a:hover {
            text-decoration: underline;
        }

        .auth-card .forgot-link {
            font-size: 12px;
            color: #737373;
        }

        /* Botões Estilo SaaS Minimalista */
        .auth-card .btn-primary {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .auth-card .btn-primary:hover {
            background-color: #e5e5e5;
        }

        .auth-card .btn-secondary {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #262626;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            transition: all 0.2s ease;
        }

        .auth-card .btn-secondary:hover {
            background-color: #121212;
            border-color: #404040;
        }

        /* Divisória */
        .auth-card .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #404040;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-card .divider::before, .auth-card .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #1f1f1f;
        }

        .auth-card .divider:not(:empty)::before { margin-right: 12px; }
        .auth-card .divider:not(:empty)::after { margin-left: 12px; }

        /* Rodapés */
        .auth-card .card-footer {
            margin-top: 24px;
            font-size: 13px;
            color: #737373;
        }

        .external-footer {
            margin-top: 24px;
            display: flex;
            gap: 16px;
        }

        .external-footer a {
            font-size: 12px;
            color: #404040;
        }

        .external-footer a:hover {
            color: #737373;
        }

        /* Erros */
        .auth-card .error-msg {
            font-size: 13px;
            color: #f87171;
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        /* Ajuste para encapsular o loop do formulário do Django */
        .auth-card .django-form-styled p {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .auth-card .django-form-styled p label {
            font-size: 12px;
            font-weight: 500;
            color: #a3a3a3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
    <style>
        :where(a, button, input, select, textarea, [tabindex]):focus-visible {
            outline: 2px solid #a3c7ff;
            outline-offset: 3px;
        }

        @media (max-width: 520px) {
            body { padding: 14px; }
            .auth-card { padding: 28px 22px; }
            .external-footer { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    {% block content %}
    {% endblock %}

    {% if user.is_authenticated %}
        <script
            src="{% static 'js/notification-sound.js' %}"
            data-sound-url="{% static 'sounds/audio.ogg' %}"
        ></script>
    {% endif %}

</body>
</html>
