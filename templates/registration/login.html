{% extends 'base.html' %}

{% block title %}Login - Entrar{% endblock %}

{% block content %}
<div class="login-container">
    <h2>Entrar</h2>
    
    {% if form.errors %}
        <p class="error-msg">E-mail ou senha incorretos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <div class="input-group">
            <label for="id_username">E-mail</label>
            <input type="email" id="id_username" name="username" placeholder="Digite seu e-mail" required autocomplete="email">
        </div>
        
        <div class="input-group">
            <label for="id_password">Senha</label>
            <input type="password" id="id_password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="login-btn">Acessar</button>
        
        <div class="form-footer">
            <a href="#">Esqueceu sua senha?</a>
            <br><br>
        <a href="{% url 'accounts:register' %}" style="font-weight: bold;">Não tem uma conta? Cadastre-se</a>        </div>
    </form>
</div>
{% endblock %}
