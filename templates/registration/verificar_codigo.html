<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - BlackFeather</title>
    <style>
        /* Reset de Estilos Básicos */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Plano de Fundo Geral */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Wrapper de Centralização */
        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        /* Cartão de Autenticação */
        .auth-card {
            background-color: #121212;
            border: 1px solid #1f1f1f;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        /* Cabeçalho */
        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #8c8c8c;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* Estrutura dos Campos */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .label-row {
            margin-bottom: 8px;
        }

        label {
            color: #8c8c8c;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Inputs de Texto e Senha */
        input {
            width: 100%;
            padding: 14px;
            background-color: #050505;
            border: 1px solid #222222;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #444444;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
        }

        /* Estilo Customizado para o Token/Código */
        input#id_codigo {
            text-align: center;
            font-size: 22px;
            letter-spacing: 6px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Botão Principal */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #e6e6e6;
        }

        /* Balão de Mensagem de Erro */
        .error-msg {
            background-color: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="auth-card">
            
            <h2>Redefinir Senha</h2>
            <div class="subtitle">Insira o código enviado e suas novas credenciais.</div>
            
            <!-- Bloco de Mensagens de Erro Dinâmicas do Django -->
            {% if messages %}
                {% for message in messages %}
                    <div class="error-msg">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Formulário de Envio -->
            <form method="POST">
                {% csrf_token %}

                <!-- Campo do Código de 6 Dígitos -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="id_codigo">Código de 6 dígitos enviado por e-mail:</label>
                    </div>
                    <input 
                        type="text" 
                        id="id_codigo" 
                        name="codigo" 
                        maxlength="6" 
                        required 
                        placeholder="000000"
                        autocomplete="off"
                    >
                </div>

                <!-- Campo Nova Senha -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="id_nova_senha">Nova Senha:</label>
                    </div>
                    <input 
                        type="password" 
                        id="id_nova_senha" 
                        name="nova_senha" 
                        required 
                        placeholder="••••••••"
                    >
                </div>

                <!-- Campo Confirmar Nova Senha -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="id_confirmar_senha">Confirmar Nova Senha:</label>
                    </div>
                    <input 
                        type="password" 
                        id="id_confirmar_senha" 
                        name="confirmar_senha" 
                        required 
                        placeholder="••••••••"
                    >
                </div>

                <!-- Botão de Ação -->
                <button type="submit" class="btn-primary">Salvar Nova Senha</button>
            </form>

        </div>
    </div>

</body>
</html>
