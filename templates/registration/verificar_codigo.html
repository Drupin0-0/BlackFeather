<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - BlackFeather</title>
    <link rel="stylesheet" href="{% static 'css/password-verify.css' %}">
</head>
<body>

    <div class="login-wrapper">
        <div class="auth-card">
            
            <h2>Redefinir Senha</h2>
            <div class="subtitle">Insira o código enviado e suas novas credenciais.</div>
            
            <!-- Bloco de Mensagens de Erro Dinâmicas do Django -->
            {% if messages %}
                {% for message in messages %}
                    <div class="error-msg">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Formulário de Envio -->
            <form method="POST">
                {% csrf_token %}

                <!-- Campo do Código de 6 Dígitos -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="id_codigo">Código de 6 dígitos enviado por e-mail:</label>
                    </div>
                    <input 
                        type="text" 
                        id="id_codigo" 
                        name="codigo" 
                        maxlength="6" 
                        required 
                        placeholder="000000"
                        autocomplete="off"
                    >
                </div>

                <!-- Campo Nova Senha -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="id_nova_senha">Nova Senha:</label>
                    </div>
                    <input 
                        type="password" 
                        id="id_nova_senha" 
                        name="nova_senha" 
                        required 
                        placeholder="••••••••"
                    >
                </div>

                <!-- Campo Confirmar Nova Senha -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="id_confirmar_senha">Confirmar Nova Senha:</label>
                    </div>
                    <input 
                        type="password" 
                        id="id_confirmar_senha" 
                        name="confirmar_senha" 
                        required 
                        placeholder="••••••••"
                    >
                </div>

                <!-- Botão de Ação -->
                <button type="submit" class="btn-primary">Salvar Nova Senha</button>
            </form>

        </div>
    </div>

</body>
</html>
