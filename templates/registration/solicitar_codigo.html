{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha - BlackFeather</title>
    <link rel="stylesheet" href="{% static 'css/password-reset.css' %}">
</head>
<body>

    <!-- O card que gera a divisão visual idêntico ao login -->
    <div class="login-card-container">
        
        <!-- Logo oficial (Corrigida a tag com a imagem do corvo) -->
        <div class="logo-container">
            <img src="{% static 'images/favicon.svg' %}" alt="BlackFeather Logo">
        </div>

        <h2>Recuperação de Senha</h2>
        <div class="subtitle">Insira seu e-mail para receber o código de verificação.</div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="input-group">
                <div class="label-row">
                    <label for="id_email">E-mail cadastrado</label>
                </div>
                <input type="email" id="id_email" name="email" placeholder="seu@email.com" required>
            </div>
            
            <button type="submit" class="login-btn">Enviar Código</button>
        </form>
        
        <div class="divider-container">
            <span class="divider-text">ou</span>
        </div>

        <div class="form-footer">
            <a href="{% url 'accounts:login' %}">Voltar para o Login</a>
        </div>
    </div>

</body>
</html>
