{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha - BlackFeather</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Fundo da tela inteira: Preto absoluto igual ao seu login */
            background-color: #000000; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes smoothFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CARD CENTRAL: Mesma cor, borda fina e arredondamento do seu painel de login */
        .login-card-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            background-color: #0f0f11; /* Cinza escuro idêntico ao card de login */
            border: 1px solid #1f1f23; /* Borda sutil delimitando o card */
            border-radius: 12px;       /* Cantos arredondados do seu design */
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: smoothFadeIn 0.5s ease-out forwards;
        }

        /* Ajuste do tamanho e centralização do logo circular */
        .logo-container {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            width: 128px;
            height: 128px;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Tipografia rigorosamente alinhada com o login */
        .login-card-container h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .login-card-container .subtitle {
            font-size: 13.5px;
            color: #71717a; /* Cor cinza exata do texto de apoio */
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Alerta de erro com o mesmo fundo escuro avermelhado */
        .error-msg {
            color: #ef4444;
            background-color: #1c1010;
            border: 1px solid #3b1818;
            border-radius: 6px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: #a1a1aa; /* Cinza das labels */
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Inputs pretos embutidos com contorno nítido */
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #27272a; 
            border-radius: 6px;
            background-color: #040405; /* Fundo interno do input escurecido */
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input:focus {
            border-color: #52525b;
        }

        .input-group input::placeholder {
            color: #4b5563;
        }

        /* Botão principal retangular branco com cantos suavizados */
        .login-btn {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            border-radius: 6px;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            margin-bottom: 5px;
            transition: opacity 0.2s ease;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        /* Divisória "ou" linear idêntica ao rodapé de login */
        .divider-container {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            width: 100%;
        }

        .divider-container::before,
        .divider-container::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #1f1f23; 
        }

        .divider-text {
            font-size: 11px;
            font-weight: 600;
            color: #52525b;
            padding: 0 16px;
            text-transform: uppercase;
        }

        /* Rodapé com o texto secundário cinza */
        .form-footer {
            font-size: 13px;
            color: #71717a;
            margin-top: 12px;
        }

        .form-footer a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- O card que gera a divisão visual idêntico ao login -->
    <div class="login-card-container">
        
        <!-- Logo oficial (Corrigida a tag com a imagem do corvo) -->
        <div class="logo-container">
            <img src="{% static 'images/favicon.svg' %}" alt="BlackFeather Logo">
        </div>

        <h2>Recuperação de Senha</h2>
        <div class="subtitle">Insira seu e-mail para receber o código de verificação.</div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="input-group">
                <div class="label-row">
                    <label for="id_email">E-mail cadastrado</label>
                </div>
                <input type="email" id="id_email" name="email" placeholder="seu@email.com" required>
            </div>
            
            <button type="submit" class="login-btn">Enviar Código</button>
        </form>
        
        <div class="divider-container">
            <span class="divider-text">ou</span>
        </div>

        <div class="form-footer">
            <a href="{% url 'accounts:login' %}">Voltar para o Login</a>
        </div>
    </div>

</body>
</html>
