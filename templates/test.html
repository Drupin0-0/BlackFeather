<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat · {{ project.title }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 78% 0%, rgba(41, 62, 91, 0.16), transparent 42%), #08090b;
            color: #ffffff;
            font-family: Inter, 'Segoe UI', sans-serif;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            padding: 18px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            min-height: calc(100dvh - 36px);
            margin: 0 auto;
            padding: clamp(20px, 4vw, 38px);
            display: flex;
            flex-direction: column;
            background: rgba(12, 15, 19, 0.92);
            border: 1px solid color-mix(in srgb, var(--project-accent, #a3c7ff) 45%, #252b34);
            border-top: 3px solid var(--project-accent, #a3c7ff);
            border-radius: 16px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            animation: smoothFadeIn 0.3s ease-out forwards;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 16px;
        }

        .chat-header h1 {
            color: var(--project-accent, #ffffff);
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .chat-back-link {
            display: inline-block;
            color: #777777;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            text-decoration: none;
            margin-bottom: 8px;
            transition: color 0.2s ease;
        }

        .chat-back-link:hover {
            color: #ffffff;
        }

        .chat-header span {
            color: #777777;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .chat-back-link:focus-visible, .chat-input:focus-visible, .chat-send:focus-visible {
            outline: 2px solid #a3c7ff;
            outline-offset: 3px;
        }

        .chat-box {
            flex: 1;
            min-height: 320px;
            overflow-y: auto;
            background: linear-gradient(145deg, #101318, #090b0e);
            border: 1px solid #252b34;
            border-radius: 12px;
            padding: 20px;
        }

        /* Scrollbar */

        .chat-box::-webkit-scrollbar {
            width: 5px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #090909;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #2a2a2a;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        .chat-message {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-message:last-child {
            border-bottom: none;
        }

        .chat-message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .chat-username {
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
        }

        .chat-time {
            color: #555555;
            font-size: 10px;
        }

        .chat-content {
            color: #bdbdbd;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .chat-empty {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            color: #555555;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .chat-input {
            flex: 1;
            min-width: 0;

            background: #050505;
            border: 1px solid #222222;

            color: #ffffff;

            padding: 12px 14px;

            font-family: inherit;
            font-size: 13px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
            border-radius: 9px;
        }

        .chat-input::placeholder {
            color: #3d3d3d;
        }

        .chat-input:focus {
            border-color: var(--project-accent, #444444);
            box-shadow: 0 0 0 1px var(--project-accent, #444444);
        }

        .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-send {
            background: var(--project-accent, #ffffff);
            color: #000000;

            border: 1px solid var(--project-accent, #ffffff);

            padding: 12px 18px;

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
            border-radius: 9px;

            transition:
                opacity 0.2s ease,
                transform 0.1s ease;
        }

        .chat-send:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .chat-send:active {
            transform: translateY(0);
        }

        .chat-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .chat-status {
            margin-top: 10px;

            color: #555555;

            font-size: 12px;

            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .chat-status.connected {
            color: #777777;
        }

        .chat-status.disconnected {
            color: #555555;
        }

        @keyframes smoothFadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {

            .chat-container {
                max-width: 100%;
                min-height: calc(100dvh - 20px);
                padding: 18px 14px;
                border-radius: 12px;
            }

            .chat-header {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }

            .chat-box {
                min-height: min(52vh, 420px);
            }

            .chat-form {
                align-items: stretch;
            }

            .chat-send {
                padding-inline: 14px;
            }
        }

        /* Atenção: esta regra sobrescreve TODOS os border-radius acima.
           Remova se não for intencional. */
        * { border-radius: 2px !important; }
    </style>
</head>

<body>

    <div class="chat-container" style="--project-accent: {{ project.accent_color }}">

    <div class="chat-header">

        <div>
            <a href="{% url 'project_list' %}" id="backLink" class="chat-back-link">
                ← Voltar
            </a>

            <h1>{{ project.title }}</h1>
        </div>

        <span>
            Comunicação da equipe
        </span>

    </div>


    <div id="chat" class="chat-box">

        <div class="chat-empty">
            Carregando mensagens...
        </div>

    </div>


    <form id="messageForm" class="chat-form">

        <!-- Começa desabilitado; o JS habilita quando o WebSocket conectar -->
        <input
            type="text"
            id="messageInput"
            class="chat-input"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
            maxlength="2000"
            disabled
        >

        <button
            type="submit"
            id="sendButton"
            class="chat-send"
            disabled
        >
            Enviar
        </button>

    </form>


    <div
        id="chatStatus"
        class="chat-status"
    >
        Conectando...
    </div>

</div>


<script>

    /*
     * Botão "Voltar": se o usuário veio de outra página do próprio site
     * (dashboard ou lista de projetos), volta pra ela com o histórico do
     * navegador. Se a página foi aberta direto (link salvo, nova aba, etc.),
     * o href real do link já leva pra lista de projetos.
     */
    const backLink = document.getElementById("backLink");

    backLink.addEventListener("click", function (event) {
        if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
            event.preventDefault();
            history.back();
        }
    });


    const projectCode = "{{ project_code|escapejs }}";


    const chat = document.getElementById("chat");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chatStatus = document.getElementById("chatStatus");


    /*
     * Habilita/desabilita o input e o botão juntos.
     */
    function setChatEnabled(enabled) {
        messageInput.disabled = !enabled;
        sendButton.disabled = !enabled;
    }


    /*
     * Escolhe ws:// ou wss:// automaticamente.
     *
     * HTTP  -> ws://
     * HTTPS -> wss://
     */
    const protocol = window.location.protocol === "https:"
        ? "wss:"
        : "ws:";


    const socket = new WebSocket(
        `${protocol}//${window.location.host}/ws/projetos/${projectCode}/chat/`
    );


    /*
     * Quando o WebSocket conectar
     */
    socket.onopen = function () {

        console.log("WebSocket conectado!");

        chatStatus.textContent = "Conectado";
        chatStatus.classList.remove("disconnected");
        chatStatus.classList.add("connected");

        // CORREÇÃO: habilita o input (antes só o botão era habilitado)
        setChatEnabled(true);

        messageInput.focus();
    };


    /*
     * Mensagens recebidas do servidor
     */
    socket.onmessage = function (event) {

        const data = JSON.parse(event.data);


        /*
         * Histórico enviado quando o chat abre
         */
        if (data.type === "history") {

            chat.innerHTML = "";

            if (!data.messages.length) {
                const empty = document.createElement("div");
                empty.className = "chat-empty";
                empty.textContent = "Ainda não há mensagens. Comece a conversa da equipe.";
                chat.appendChild(empty);
            }

            data.messages.forEach(function (message) {
                addMessage(message);
            });

            scrollToBottom();

            return;
        }


        /*
         * Nova mensagem recebida
         */
        if (data.type === "message") {

            addMessage(data);

            scrollToBottom();

        }

    };


    /*
     * WebSocket fechado
     */
    socket.onclose = function () {

        console.log("WebSocket fechado.");

        chatStatus.textContent = "Desconectado";
        chatStatus.classList.remove("connected");
        chatStatus.classList.add("disconnected");

        setChatEnabled(false);

    };


    /*
     * Erro no WebSocket
     */
    socket.onerror = function (error) {

        console.log("Erro no WebSocket:", error);

        chatStatus.textContent = "Erro na conexão";

        setChatEnabled(false);

    };


    /*
     * Envio da mensagem
     */
    messageForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const content = messageInput.value.trim();


        /*
         * Não envia mensagem vazia
         */
        if (!content) {
            return;
        }


        /*
         * Verifica se o WebSocket está conectado
         */
        if (socket.readyState !== WebSocket.OPEN) {

            console.log("WebSocket não está conectado.");

            return;
        }


        /*
         * Envia para o Django Channels
         */
        socket.send(
            JSON.stringify({
                message: content
            })
        );


        /*
         * Limpa o input
         */
        messageInput.value = "";

        messageInput.focus();

    });


    /*
     * Adiciona uma mensagem ao chat
     */
    function addMessage(message) {

        /*
         * Remove "Carregando mensagens..."
         */
        const emptyMessage = chat.querySelector(".chat-empty");

        if (emptyMessage) {
            emptyMessage.remove();
        }


        /*
         * Container da mensagem
         */
        const messageElement = document.createElement("div");
        messageElement.classList.add("chat-message");


        /*
         * Cabeçalho
         */
        const headerElement = document.createElement("div");
        headerElement.classList.add("chat-message-header");


        /*
         * Nome do usuário
         */
        const usernameElement = document.createElement("span");
        usernameElement.classList.add("chat-username");
        usernameElement.textContent = message.username;


        /*
         * Horário
         */
        const timeElement = document.createElement("span");
        timeElement.classList.add("chat-time");

        const date = new Date(message.created_at);
        timeElement.textContent = date.toLocaleString("pt-BR");


        /*
         * Conteúdo
         *
         * IMPORTANTE: textContent é usado em vez de innerHTML
         * para impedir que uma mensagem contendo HTML/JavaScript
         * seja executada.
         */
        const contentElement = document.createElement("div");
        contentElement.classList.add("chat-content");
        contentElement.textContent = message.message;


        /*
         * Monta a mensagem
         */
        headerElement.appendChild(usernameElement);
        headerElement.appendChild(timeElement);

        messageElement.appendChild(headerElement);
        messageElement.appendChild(contentElement);

        chat.appendChild(messageElement);

    }


    /*
     * Scroll automático para a última mensagem
     */
    function scrollToBottom() {

        chat.scrollTop = chat.scrollHeight;

    }

</script>

</body>
</html>
