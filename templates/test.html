{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat do Projeto</title>

    <link rel="stylesheet" href="{% static 'css/test.css' %}">
</head>

<body>

<div class="chat-container">

    <div class="chat-header">

        <h1>Chat do Projeto</h1>

        <span>
            ComunicaÃ§Ã£o da equipe
        </span>

    </div>


    <div id="chat" class="chat-box">

        <div class="chat-empty">
            Carregando mensagens...
        </div>

    </div>


    <form id="messageForm" class="chat-form">

        <input
            type="text"
            id="messageInput"
            class="chat-input"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
            maxlength="2000"
        >

        <button
            type="submit"
            id="sendButton"
            class="chat-send"
        >
            Enviar
        </button>

    </form>


    <div
        id="chatStatus"
        class="chat-status"
    >
        Conectando...
    </div>

</div>


<script src="{% static 'js/test.js' %}"></script>

</body>
</html>
