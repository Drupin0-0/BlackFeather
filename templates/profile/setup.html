<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure seu Perfil | BlackFeather</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <style>
        * { box-sizing: border-box; }

        body {
            background: #0b0b0c;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .register-card {
            background: #121214;
            border: 1px solid #202024;
            border-radius: 8px;
            padding: 24px;
            width: 100%;
            max-width: 580px;
            max-height: 94vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }

        .register-card::-webkit-scrollbar { width: 6px; }
        .register-card::-webkit-scrollbar-thumb {
            background: #29292e;
            border-radius: 4px;
        }

        .title-group {
            text-align: center;
            margin-bottom: 20px;
        }

        .title-group h1 {
            font-size: 23px;
            font-weight: 600;
            margin: 0 0 6px;
        }

        .title-group p {
            color: #888;
            font-size: 13px;
            margin: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .input-group label {
            color: #ccc;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .8px;
            font-weight: 600;
        }

        .input-group input[type="text"],
        .input-group input[type="date"],
        .input-group textarea {
            background: #09090a;
            border: 1px solid #29292e;
            border-radius: 5px;
            color: #fff;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #666;
        }

        .input-group textarea {
            height: 65px;
            resize: vertical;
        }

        .required { color: #f87171; }

        /* Barra de Busca de Tecnologias */
        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-box input {
            background: #09090a;
            border: 1px solid #29292e;
            border-radius: 5px;
            color: #fff;
            padding: 8px 12px;
            font-size: 12px;
            width: 100%;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0070f3;
        }

        .skills-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .skills-container::-webkit-scrollbar { width: 5px; }
        .skills-container::-webkit-scrollbar-thumb {
            background: #29292e;
            border-radius: 4px;
        }

        .category-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .category-title {
            color: #0070f3;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
            margin: 0;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 7px;
        }

        .skill-card {
            background: #09090a;
            border: 1px solid #29292e;
            border-radius: 5px;
            padding: 8px 9px;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            user-select: none;
            min-width: 0;
        }

        .skill-card:hover {
            border-color: #666;
            background: #101012;
        }

        .skill-card input[type="checkbox"] {
            accent-color: #fff;
            cursor: pointer;
            width: 13px;
            height: 13px;
            margin: 0;
            flex-shrink: 0;
        }

        .skill-card i {
            font-size: 16px;
            flex-shrink: 0;
        }

        .skill-card span {
            font-size: 11px;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-submit {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
        }

        .btn-submit:hover { background: #ddd; }

        @media (max-width: 520px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .register-card {
                margin-top: 10px;
                padding: 18px;
                max-height: 96vh;
            }

            .skills-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        * { border-radius: 2px !important; }
    </style>
</head>

<body>
    <div class="register-card">
        <div class="title-group">
            <h1>Configure seu perfil</h1>
            <p>Antes de começar, precisamos de algumas informações sobre você.</p>
        </div>

        <form action="" method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label for="name">Nome <span class="required">*</span></label>
                <input type="text" name="name" id="name" maxlength="100" placeholder="Como você quer ser chamado?" value="{{ profile.name|default:'' }}" required autocomplete="name">
            </div>

            <div class="input-group">
                <label for="bio">Conte um pouco sobre você</label>
                <textarea name="bio" id="bio" maxlength="1000" placeholder="Sua biografia...">{{ profile.bio|default:'' }}</textarea>
            </div>

            <div class="input-group">
                <label for="birth_date">Data de Nascimento</label>
                <input type="date" name="birth_date" id="birth_date" value="{{ profile.birth_date|date:'Y-m-d' }}" onclick="this.showPicker()">
            </div>

            <div class="input-group">
                <label>Tecnologias & Ferramentas</label>
                <div class="search-box">
                    <input type="text" id="skill-search" placeholder=" Filtrar tecnologias (ex: Postgres, Docker, React)...">
                </div>
            </div>

            <div class="skills-container" id="skills-container">

                <!-- Linguagens -->
                <div class="category-group">
                    <h4 class="category-title">Linguagens de Programação</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="JavaScript"><i class="devicon-javascript-plain colored"></i><span>JavaScript</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="TypeScript"><i class="devicon-typescript-plain colored"></i><span>TypeScript</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Python"><i class="devicon-python-plain colored"></i><span>Python</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Java"><i class="devicon-java-plain colored"></i><span>Java</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="C++"><i class="devicon-cplusplus-plain colored"></i><span>C++</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="C#"><i class="devicon-csharp-plain colored"></i><span>C#</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="PHP"><i class="devicon-php-plain colored"></i><span>PHP</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Go"><i class="devicon-go-original-wordmark colored"></i><span>Go</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Rust"><i class="devicon-rust-plain colored"></i><span>Rust</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Ruby"><i class="devicon-ruby-plain colored"></i><span>Ruby</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Kotlin"><i class="devicon-kotlin-plain colored"></i><span>Kotlin</span></label>
                    </div>
                </div>

                <!-- Frontend -->
                <div class="category-group">
                    <h4 class="category-title">Frontend</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="HTML5"><i class="devicon-html5-plain colored"></i><span>HTML5</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="CSS3"><i class="devicon-css3-plain colored"></i><span>CSS3</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="React"><i class="devicon-react-original colored"></i><span>React</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Vue.js"><i class="devicon-vuejs-plain colored"></i><span>Vue.js</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Angular"><i class="devicon-angularjs-plain colored"></i><span>Angular</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Next.js"><i class="devicon-nextjs-plain colored"></i><span>Next.js</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Svelte"><i class="devicon-svelte-plain colored"></i><span>Svelte</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Tailwind CSS"><i class="devicon-tailwindcss-plain colored"></i><span>Tailwind</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Bootstrap"><i class="devicon-bootstrap-plain colored"></i><span>Bootstrap</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Sass"><i class="devicon-sass-original colored"></i><span>Sass</span></label>
                    </div>
                </div>

                <!-- Backend -->
                <div class="category-group">
                    <h4 class="category-title">Backend</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="Node.js"><i class="devicon-nodejs-plain colored"></i><span>Node.js</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Express.js"><i class="devicon-express-original colored"></i><span>Express.js</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Django"><i class="devicon-django-plain colored"></i><span>Django</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Flask"><i class="devicon-flask-original colored"></i><span>Flask</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="FastAPI"><i class="devicon-fastapi-plain colored"></i><span>FastAPI</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Spring Boot"><i class="devicon-spring-plain colored"></i><span>Spring Boot</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Laravel"><i class="devicon-laravel-original colored"></i><span>Laravel</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="NestJS"><i class="devicon-nestjs-plain colored"></i><span>NestJS</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value=".NET Core"><i class="devicon-dotnetcore-plain colored"></i><span>.NET Core</span></label>
                    </div>
                </div>

                <!-- Bancos de Dados -->
                <div class="category-group">
                    <h4 class="category-title">Bancos de Dados</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="PostgreSQL"><i class="devicon-postgresql-plain colored"></i><span>PostgreSQL</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="MySQL"><i class="devicon-mysql-plain colored"></i><span>MySQL</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="MongoDB"><i class="devicon-mongodb-plain colored"></i><span>MongoDB</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Redis"><i class="devicon-redis-plain colored"></i><span>Redis</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="SQLite"><i class="devicon-sqlite-plain colored"></i><span>SQLite</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="MariaDB"><i class="devicon-mariadb-plain colored"></i><span>MariaDB</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Firebase"><i class="devicon-firebase-plain colored"></i><span>Firebase</span></label>
                    </div>
                </div>

                <!-- DevOps & Nuvem -->
                <div class="category-group">
                    <h4 class="category-title">DevOps & Cloud</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="Docker"><i class="devicon-docker-plain colored"></i><span>Docker</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Kubernetes"><i class="devicon-kubernetes-plain colored"></i><span>Kubernetes</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="AWS"><i class="devicon-amazonwebservices-plain-wordmark colored"></i><span>AWS</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="GCP"><i class="devicon-googlecloud-plain colored"></i><span>Google Cloud</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Azure"><i class="devicon-azure-plain colored"></i><span>Azure</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Git"><i class="devicon-git-plain colored"></i><span>Git</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="GitHub Actions"><i class="devicon-githubactions-plain colored"></i><span>GH Actions</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Nginx"><i class="devicon-nginx-original colored"></i><span>Nginx</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Linux"><i class="devicon-linux-plain colored"></i><span>Linux</span></label>
                    </div>
                </div>

                <!-- Mobile & Ferramentas -->
                <div class="category-group">
                    <h4 class="category-title">Mobile & Outros</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="React Native"><i class="devicon-react-original colored"></i><span>React Native</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Flutter"><i class="devicon-flutter-plain colored"></i><span>Flutter</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Android"><i class="devicon-android-plain colored"></i><span>Android</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="iOS"><i class="devicon-apple-original colored"></i><span>iOS</span></label>
                    </div>
                </div>

            </div>

            <button type="submit" class="btn-submit">Continuar</button>
        </form>
    </div>

    <script>
        // Marcando opções vindas do Django
        const existingSkills = [
            {% for skill in profile.skills.all %}
                "{{ skill.name|escapejs }}"{% if not forloop.last %},{% endif %}
            {% endfor %}
        ];

        document.querySelectorAll('input[name="skills"]').forEach(input => {
            if (existingSkills.includes(input.value)) input.checked = true;
        });

        // Filtro em tempo real
        const searchInput = document.getElementById('skill-search');
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const categoryGroups = document.querySelectorAll('.category-group');

            categoryGroups.forEach(group => {
                let hasVisibleCard = false;
                const cards = group.querySelectorAll('.skill-card');

                cards.forEach(card => {
                    const text = card.querySelector('span').textContent.toLowerCase();
                    const val = card.querySelector('input').value.toLowerCase();
                    
                    if (text.includes(term) || val.includes(term)) {
                        card.style.display = 'flex';
                        hasVisibleCard = true;
                    } else {
                        card.style.display = 'none';
                    }
                });

                group.style.display = hasVisibleCard ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
