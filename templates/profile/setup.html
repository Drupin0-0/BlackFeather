<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure seu Perfil | BlackFeather</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/profile-setup.css' %}">
</head>

<body>
    <div
        class="register-card"
        id="profileSetup"
        data-existing-skills="{% for skill in profile.skills.all %}{{ skill.name|escapejs }}{% if not forloop.last %},{% endif %}{% endfor %}"
    >
        <div class="title-group">
            <h1>Configure seu perfil</h1>
            <p>Antes de começar, precisamos de algumas informações sobre você.</p>
        </div>

        <form action="" method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label for="name">Nome <span class="required">*</span></label>
                <input type="text" name="name" id="name" maxlength="100" placeholder="Como você quer ser chamado?" value="{{ profile.name|default:'' }}" required autocomplete="name">
            </div>

            <div class="input-group">
                <label for="bio">Conte um pouco sobre você</label>
                <textarea name="bio" id="bio" maxlength="1000" placeholder="Sua biografia...">{{ profile.bio|default:'' }}</textarea>
            </div>

            <div class="input-group">
                <label for="birth_date">Data de Nascimento</label>
                <input type="date" name="birth_date" id="birth_date" value="{{ profile.birth_date|date:'Y-m-d' }}">
            </div>

            <div class="input-group skills-label">
                <label>Tecnologias & Ferramentas</label>
            </div>

            <div class="skills-container">
                <div class="category-group">
                    <h4 class="category-title">Linguagens de Programação</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="JavaScript" {% if profile.skills.all %}{% endif %}><i class="devicon-javascript-plain colored"></i><span>JavaScript</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="TypeScript"><i class="devicon-typescript-plain colored"></i><span>TypeScript</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Python"><i class="devicon-python-plain colored"></i><span>Python</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Java"><i class="devicon-java-plain colored"></i><span>Java</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="C++"><i class="devicon-cplusplus-plain colored"></i><span>C++</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="C#"><i class="devicon-csharp-plain colored"></i><span>C#</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="PHP"><i class="devicon-php-plain colored"></i><span>PHP</span></label>
                    </div>
                </div>

                <div class="category-group">
                    <h4 class="category-title">Frontend</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="HTML5"><i class="devicon-html5-plain colored"></i><span>HTML5</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="CSS3"><i class="devicon-css3-plain colored"></i><span>CSS3</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="React"><i class="devicon-react-original colored"></i><span>React</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Vue.js"><i class="devicon-vuejs-plain colored"></i><span>Vue.js</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Angular"><i class="devicon-angularjs-plain colored"></i><span>Angular</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Tailwind CSS"><i class="devicon-tailwindcss-plain colored"></i><span>Tailwind</span></label>
                    </div>
                </div>

                <div class="category-group">
                    <h4 class="category-title">Backend</h4>
                    <div class="skills-grid">
                        <label class="skill-card"><input type="checkbox" name="skills" value="Node.js"><i class="devicon-nodejs-plain colored"></i><span>Node.js</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Express.js"><i class="devicon-express-original colored"></i><span>Express.js</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Django"><i class="devicon-django-plain colored"></i><span>Django</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Flask"><i class="devicon-flask-original colored"></i><span>Flask</span></label>
                        <label class="skill-card"><input type="checkbox" name="skills" value="Spring Boot"><i class="devicon-spring-plain colored"></i><span>Spring Boot</span></label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Continuar</button>
        </form>
    </div>

    <script src="{% static 'js/profile-setup.js' %}"></script>
</body>
</html>
